name: validate

# The CI loop is the agent's repair loop: same commands, same order, runnable
# locally. No check that does not exist locally.
#
# Actions are pinned to full commit SHAs. A tag such as `v4` can be moved by
# someone with write access to the action repository; a SHA cannot. The version
# number stays in the comment so that an upgrade remains readable.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Reference environment (Node from .node-version)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The control-plane check compares against the base of the pull
          # request. A shallow clone would not have that base.
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Dependencies (exactly from the lockfile, no npx in the build)
        run: npm ci

      - name: Check the sources
        env:
          CHECK_BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || (github.event_name == 'push' && format('{0}~1', github.sha) || '') }}
        run: |
          set -o pipefail
          ./node_modules/.bin/astro sync
          node scripts/check.mjs source --json | tee /tmp/source.json
          node -e '
            const d = JSON.parse(require("fs").readFileSync("/tmp/source.json", "utf8"));
            const cp = d.diagnostics.filter((x) => x.code === "CONTROL_PLANE_CHANGED");
            if (cp.length) {
              console.log("::notice title=Control plane changed (R-19)::" + cp[0].message + " — these files need a human review, see docs/security.md");
            }
          '

      - name: Build and check the output
        run: |
          set -o pipefail
          ./node_modules/.bin/astro build
          node scripts/check.mjs dist --json | tee /tmp/dist.json
          node -e '
            const d = JSON.parse(require("fs").readFileSync("/tmp/dist.json", "utf8"));
            const robots = require("fs").readFileSync("dist/robots.txt", "utf8");
            if (!/^Disallow: \//m.test(robots)) {
              console.log("::error title=Template indexable::robots.txt does not block indexing although lifecycle is development (R-21)");
            }
          '

      - name: Tests (contract, units, build)
        run: npm test

      - name: Prove reproducibility
        run: npm run reproducible

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist
          retention-days: 7
          if-no-files-found: error

  compatibility:
    name: Compatibility Node 22 (lower bound from engines)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - name: validate, build, test on the lowest supported version
        run: |
          npm run validate
          npm run build
          npm test

  release:
    name: Release archive is clean
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci
      - name: Build the archive from the commit and check its content
        run: npm run release:archive
