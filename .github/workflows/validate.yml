name: validate

# Der CI-Loop ist der Reparatur-Loop des Agenten: dieselben Befehle, dieselbe
# Reihenfolge, lokal ausführbar. Keine Prüfung, die es lokal nicht gibt.
#
# Aktionen sind auf vollständige Commit-SHAs gepinnt. Ein Tag wie `v4` kann von
# jemandem mit Schreibrecht auf dem Aktions-Repository verschoben werden; eine SHA
# nicht. Die Versionsnummer steht im Kommentar, damit ein Upgrade lesbar bleibt.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Referenzumgebung (Node aus .node-version)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Die Control-Plane-Prüfung vergleicht gegen die Basis des Pull Requests.
          # Ein flacher Clone hätte diese Basis nicht.
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Abhängigkeiten (exakt aus dem Lockfile, kein npx im Build)
        run: npm ci

      - name: Quellen prüfen
        env:
          CHECK_BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || (github.event_name == 'push' && format('{0}~1', github.sha) || '') }}
        run: |
          set -o pipefail
          ./node_modules/.bin/astro sync
          node scripts/check.mjs source --json | tee /tmp/source.json
          node -e '
            const d = JSON.parse(require("fs").readFileSync("/tmp/source.json", "utf8"));
            const cp = d.diagnostics.filter((x) => x.code === "CONTROL_PLANE_CHANGED");
            if (cp.length) {
              console.log("::notice title=Control Plane geändert (R-19)::" + cp[0].message + " — diese Dateien brauchen eine menschliche Prüfung, siehe docs/security.md");
            }
          '

      - name: Bauen und Ausgabe prüfen
        run: |
          set -o pipefail
          ./node_modules/.bin/astro build
          node scripts/check.mjs dist --json | tee /tmp/dist.json
          node -e '
            const d = JSON.parse(require("fs").readFileSync("/tmp/dist.json", "utf8"));
            const robots = require("fs").readFileSync("dist/robots.txt", "utf8");
            if (!/^Disallow: \//m.test(robots)) {
              console.log("::error title=Template indexierbar::robots.txt sperrt die Indexierung nicht, obwohl lifecycle development ist (R-21)");
            }
          '

      - name: Tests (Contract, Einheiten, Build)
        run: npm test

      - name: Wiederholbarkeit nachweisen
        run: npm run reproducible

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist
          retention-days: 7
          if-no-files-found: error

  kompatibilitaet:
    name: Kompatibilität Node 22 (untere Grenze aus engines)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - name: validate, build, test auf der unteren unterstützten Version
        run: |
          npm run validate
          npm run build
          npm test

  release:
    name: Release-Archiv ist sauber
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci
      - name: Archiv aus dem Commit bauen und Inhalt prüfen
        run: npm run release:archive
